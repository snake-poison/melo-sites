name: CI

on:
  push:
    branches: [main]
  pull_request:
  # Publishes posts scheduled for today: the build leaves out any post dated after it
  # (layers/melo/app/utils/schedule.ts). Cron runs in UTC; 10:30 is 6:30am in North Carolina in summer and
  # 5:30am in winter, and GitHub can start a scheduled run some minutes late.
  schedule:
    - cron: '30 10 * * *'
  # Run it by hand from the Actions tab to publish anything due without waiting for the morning.
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  actions: read

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      cloudflare: ${{ steps.cloudflare.outputs.ready }}
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6.1.0
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm run lint

      - name: Typecheck
        run: pnpm run typecheck

      - name: Unit tests
        run: pnpm run test:unit

      # Until the Cloudflare secrets are set, main builds and tests but does not deploy.
      - name: Check for the Cloudflare secrets
        id: cloudflare
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        env:
          TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -n "$TOKEN" ] && [ -n "$ACCOUNT" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::Not deploying: add the CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID secrets (docs/operations.md, Configuration)."
          fi

  # Separate runners build and test all four sites concurrently. A single Vitest invocation
  # runs the synchronous global setups one after another, making CI wait for their total time.
  site-tests:
    needs: check
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        site: [charlotte, national, atlanta, consulting]
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6.1.0
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Image cache date
        if: matrix.site != 'consulting'
        id: cache-date
        run: echo "day=$(date -u +%F)" >> "$GITHUB_OUTPUT"

      - name: Restore generated images
        if: matrix.site != 'consulting'
        uses: actions/cache@v5
        with:
          path: sites/${{ matrix.site }}/.image-cache
          key: ${{ runner.os }}-melo-images-v1-${{ matrix.site }}-${{ github.sha }}-${{ steps.cache-date.outputs.day }}
          restore-keys: ${{ runner.os }}-melo-images-v1-${{ matrix.site }}-

      # Bootstrap from a tested main artifact when a branch cannot see the cache yet.
      # Source hashes and encoder settings are checked before any image is reused.
      - name: Seed images from the last tested release
        if: matrix.site != 'consulting'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: node scripts/seed-image-cache.mjs ${{ matrix.site }}

      # Builds the production site with publication fixtures, then checks URLs, SEO, forms,
      # sitemaps, drafts and page-weight budgets. No checks or generated assets are skipped.
      - name: Site tests
        run: pnpm exec vitest --run --project=site-${{ matrix.site }}

      # What the tests passed is what ships: deployment downloads this exact tested build.
      - name: Keep the tested build
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: actions/upload-artifact@v7
        with:
          name: site-${{ matrix.site }}
          path: sites/${{ matrix.site }}/.output/public
          retention-days: 3

      - name: Keep the validated image cache
        if: matrix.site != 'consulting' && github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: actions/upload-artifact@v7
        with:
          name: image-cache-${{ matrix.site }}
          path: sites/${{ matrix.site }}/.image-cache
          include-hidden-files: true
          retention-days: 3

  # Cloudflare Pages, from main only: on a push, the daily schedule or a run by hand. Each site is
  # a Direct Upload project of its own; the repo's CLOUDFLARE_API_TOKEN (permission: Account >
  # Cloudflare Pages > Edit) and CLOUDFLARE_ACCOUNT_ID secrets let wrangler publish to them.
  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && needs.check.outputs.cloudflare == 'true'
    needs: [check, site-tests]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - site: charlotte
            project: publicadjusterscharlotte
            url: https://publicadjusterscharlotte.com
          - site: national
            project: melopropertyclaimsadjusting
            url: https://melopropertyclaimsadjusting.com
          - site: atlanta
            project: publicadjustersofatlanta
            url: https://publicadjustersofatlanta.com
          # On pages.dev until propertyclaimsconsulting.net points at the project.
          - site: consulting
            project: propertyclaimsconsulting
            url: https://propertyclaimsconsulting.pages.dev
    environment:
      name: ${{ matrix.site }}
      url: ${{ matrix.url }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version

      - uses: actions/download-artifact@v8
        with:
          name: site-${{ matrix.site }}
          path: sites/${{ matrix.site }}/.output/public

      # What the site serves before this deploy, so IndexNow hears only about what changed.
      - name: Save the live sitemap
        if: matrix.site != 'consulting'
        run: curl -fsS ${{ matrix.url }}/sitemap.xml -o "$RUNNER_TEMP/live-sitemap.xml" || touch "$RUNNER_TEMP/live-sitemap.xml"

      - name: Deploy to Cloudflare Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@4 pages deploy sites/${{ matrix.site }}/.output/public --project-name=${{ matrix.project }} --branch=main --commit-hash=${{ github.sha }}

      # The site is live; a failed ping is worth a look but does not undo the deploy.
      # Consulting has no IndexNow key yet, and pages.dev is not its canonical host.
      - name: Tell IndexNow what changed
        if: matrix.site != 'consulting'
        continue-on-error: true
        run: node scripts/indexnow.mjs ${{ matrix.site }} "$RUNNER_TEMP/live-sitemap.xml"
